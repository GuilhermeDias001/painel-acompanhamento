# Gera os dados do painel a partir das planilhas (Microsoft Graph) e publica no Pages.
# Sem schedule: em 04/10 ele não disparou e em 05/10 uma execução agendada ficou presa na
# fila por 3 h, travando as demais. Por isso cada execução, no job "encadear", espera até o
# próximo múltiplo de 10 min e dispara a seguinte (workflow_dispatch). Só a execução mais
# nova continua a corrente: se houver duas, a mais antiga para. Um push (ou disparo manual) religa a corrente se ela cair.
name: Atualizar painel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # sem 'concurrency': em 05 e 06/10 uma execução presa na fila segurou todas as seguintes
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar dados
        env:
          CHAVE_CI: ${{ secrets.CHAVE_CI }}
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
        run: node gerador/ci.mjs

      - name: Guardar token renovado
        if: always()
        run: |
          git add segredos.enc
          if [ -f geocache.enc ]; then git add geocache.enc; fi
          if [ -f historico-quadro.enc ]; then git add historico-quadro.enc; fi
          if ! git diff --cached --quiet; then
            git -c user.name=GuilhermeDias001 -c user.email=GuilhermeDias001@users.noreply.github.com commit -q -m "Renova token / coordenadas"
            git pull -q --rebase origin main
            git push -q origin main
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

  encadear:
    needs: atualizar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Esperar o próximo horário e disparar a próxima execução
        run: |
          agora=$(date +%s)
          proximo=$(( (agora / 600 + 1) * 600 + 120 ))   # próximo múltiplo de 10 min, +2 min
          sleep $(( proximo - agora ))
          mais_nova=$(gh run list --workflow atualizar.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ "$mais_nova" = "${{ github.run_id }}" ]; then
            gh workflow run atualizar.yml --ref main
            echo "próxima execução disparada"
          else
            echo "há execução mais nova ($mais_nova): esta corrente para aqui"
          fi
